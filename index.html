<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
    <title>Bubble Shooter</title>
</head>

<body>

    <div class="panel">
        <div class="panelTop">
            <div class="elem">
                <h3>Hit</h3>

        </div>

        <div class="panelBottom">

        </div>
    </div>

    <script src="script.js"></script>

</html>
